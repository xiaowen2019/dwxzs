<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>党务工作助手</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 50px;
        }
        h1 {
            font-size: 36px;
            color: #333;
        }
        .button-container {
            display: inline-block;
            margin: 20px;
        }
        .button {
            display: block;
            width: 200px;
            height: 100px;
            line-height: 100px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            font-size: 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .button:hover {
            opacity: 0.9;
        }
        .button.purple {
            background: linear-gradient(135deg, #ff7c92, #fec564);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .button.blue {
            background: linear-gradient(135deg, #66c0f4, #a6e1fa);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>党务工作助手</h1>
        <p>让党务工作更高效、更轻松。</p>
        <div class="button-container">
            <a href="pingjia.html" class="button purple">评语撰写</a>
        </div>
        <div class="button-container">
            <a href="https://docs.qq.com/aio/p/sco69rzu0xo60qi?p=RkSgKnJ96UIr6Jhsa1xKPJ&nlc=1" class="button blue">知识快查</a>
        </div>
    </div>
</body>
</html>
